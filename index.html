<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7928CA" />
    <link rel="apple-touch-icon" href="icons-512.png">
    <meta charset="UTF-8">
    <title>Ausgaben</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@exampledev/new.css@1.1.3/new.min.css">
    <style>
        body {
            padding: 0.5rem;
        }

        :invalid {
            border-color: #ec5840;
        }

        :invalid~button {
            /*buttons nach invaliden elementen unter gleichem parent sind disabled*/
            opacity: .5;
            pointer-events: none
        }

        .toggle label {
            float: left;
            font-size: 1.5rem;
            width: 9rem;
            margin-bottom: 0.5rem;
            background-color: var(--nc-bg-3);
        }

        .toggle label span {
            text-align: center;
            display: block;
            border-radius: 4px;
        }

        .toggle label input {
            position: absolute;
            top: -20px;
        }

        .payer input:checked+span {
            background-color: var(--nc-lk-1);
        }

        .menu input:checked+span {
            background-color: var(--nc-ac-1);
        }

        table,
        tr,
        td {
            border: none;
            padding: 0px;
            vertical-align: top;
        }

        tr:hover {
            background-color: var(--nc-bg-3);
        }

        .fadeout {
            opacity: 0;
            transition: visibility 0s 2s, opacity 2s linear;
        }
    </style>
</head>

<body><!-- Button zur Aktivierung der API -->
    <div style="font-size:1.3rem;margin-bottom: 0.5rem" id="schulden"></div>
    <div class="toggle menu" style="display:flex">
        <label style="flex: 1 1 auto"><input type="radio" id="zahlungRadio" name="menuTabs" onclick="openTab('zahlungTab')" checked autocomplete="off"><span>Zahlung</span></label> <!-- autocomplete="off" damit FF sich checked state nicht merkt: https://stackoverflow.com/a/471140 -->
        <label style="flex: 1 1 auto"><input type="radio" id="historyRadio" name="menuTabs" onclick="openTab('historyTab')" autocomplete="off"><span>History</span></label>
    </div>
    <div id="zahlungTab" class="tabcontent">
        <div id="payerToggle" class="toggle payer" style="display:flex">
            <label style="flex: 1 1 auto"><input type="radio" id="andreasRadio" name="payer" onclick="document.getElementById('amount').focus();updatePersonAmounts()" autocomplete="off" checked><span>Andreas</span></label>
            <label style="flex: 1 1 auto"><input type="radio" id="dagmarRadio" name="payer" onclick="document.getElementById('amount').focus();updatePersonAmounts()" autocomplete="off"><span>Dagmar</span></label>
        </div>
        <form id="splitForm" autocomplete="off" onsubmit="return false;" style="display: grid;grid-template-columns: 12ch auto; align-items: baseline; column-gap: 0.5em">
            <label for="amount">Betrag</label>
            <input type="number" id="amount" name="amount" min="0" step="0.01" onfocus="this.select()" required>
            <label for="andreasShareAbs">Andreas</label>
            <input type="number" id="andreasShareAbs" name="andreasShareAbs" min="0" step="0.001" placeholder="Andreas Anteil" onfocus="this.select()">
            <label for="dagmarShareAbs">Dagmar</label>
            <input type="number" id="dagmarShareAbs" name="dagmarShareAbs" min="0" step="0.001" placeholder="Dagmar Anteil" onfocus="this.select()">
            <label for="kategorie">Kategorie</label>
            <select id="kategorie" name="kategorie" onchange="updatePersonAmounts()">
                <option value="Essen" selected>Essen</option>
                <option value="Trinken">Trinken</option>
                <option value="Amazon">Amazon</option>
                <option value="Kultur">Kultur</option>
                <option value="Unterkunft">Unterkunft</option>
                <option value="Sonstiges">Sonstiges</option>
                <option value="Geldtransfer">Geldtransfer</option>
            </select>
            <label for="beschreibung">Beschreibung</label>
            <input id="beschreibung" name="beschreibung" placeholder="Grund der Zahlung">
            <label for="zeitpunkt">Zeitpunkt</label>
            <input type="datetime-local" id="zeitpunkt" name="zeitpunkt" placeholder="Zeitpunkt der Zahlung">
            <button type="button" id="neu" onclick="neuClick()">Neu</button><button type="button" style="white-space:break-spaces" id="speichern" onclick="speichernClick()">Speichern <span style="font-size:small" id="editId"></span></button>
            <div></div>
        </form>
        <div id="infoText"></div>
    </div>
    <div id="historyTab" class="tabcontent" style="display: none">
        <div id="table-wrapper"></div>
        <button type="button" onclick="deleteLocalStorage()">Alles löschen</button>
        <button type="button" onclick="document.getElementById('fileInput').click()">Import</button>
        <!-- Das unsichtbare Datei-Feld, das im Hintergrund die Arbeit macht -->
        <input type="file" id="fileInput" accept=".txt" style="display: none;" />
    </div>
    <script>
        const andreasShareInput = document.getElementById('andreasShareAbs');
        const dagmarShareInput = document.getElementById('dagmarShareAbs');
        const totalAmountInput = document.getElementById('amount');
        const fileInput = document.getElementById('fileInput');
        const editIdDiv = document.getElementById('editId');

        andreasShareInput.addEventListener('input', () => updateOtherShare(andreasShareInput, dagmarShareInput));
        dagmarShareInput.addEventListener('input', () => updateOtherShare(dagmarShareInput, andreasShareInput));
        totalAmountInput.addEventListener('input', setDefaultSplit);
        fileInput.addEventListener('change', importFileToLocalStorage);

        document.getElementById("zeitpunkt").value = dateNow();
        updateSchulden();
        updatePersonAmounts();

        function importFileToLocalStorage(event) {
            const reader = new FileReader();
            reader.onload = function (e) {
                let successCount = 0;
                e.target.result.split(/\r?\n/).forEach(line => {
                    if (!line.trim()) return; // Überspringt leere Zeilen
                    const separatorIndex = line.indexOf('='); // Teilt die Zeile beim ERSTEN Gleichheitszeichen auf
                    if (separatorIndex !== -1) { // Speichert den Eintrag im LocalStorage des Browsers
                        localStorage.setItem(line.substring(0, separatorIndex), line.substring(separatorIndex + 1));
                        successCount++;
                    }
                });
                alert(`${successCount} Einträge erfolgreich im LocalStorage gespeichert!`);
                fileInput.value = ''; // Setzt das Feld zurück, damit dieselbe Datei direkt nochmals gewählt werden kann
                updateSchulden();
                openTab('historyTab');
            };
            reader.readAsText(event.target.files[0]);
        }
        function readLocalStorage() {
            return Object.entries(localStorage)
                .filter(e => e[0].startsWith("Ausgabe#"))
                .sort().reverse();
        }
        function openTab(tabName) {
            Array.from(document.getElementsByClassName("tabcontent")).forEach(t => t.style.display = "none");
            document.getElementById(tabName).style.display = "block";
            if (tabName === "historyTab") {
                const groups = {}; // 1. Daten nach Jahr und Monat gruppieren
                readLocalStorage().forEach(entry => {
                    const json = JSON.parse(entry[1]);
                    const zeitpunkt = entry[0].split("#")[1]; // z.B. "2026-05-23 20:52"
                    const yearMonth = zeitpunkt.substring(0, 7); // Extrahiert "YYYY-MM"
                    if (!groups[yearMonth]) {
                        groups[yearMonth] = [];
                    }
                    groups[yearMonth].push({ entry, json, zeitpunkt });
                });
                let currentEntries = '';  // Die letzten 2 Monate werden direkt angezeigt
                let olderEntries = ''; // Ältere Einträge werden bei Bedarf ausgeklappt
                let olderCount = 0;  // Zähler für ältere Einträge
                Object.keys(groups).sort().reverse().forEach((monthKey, index) => {
                    let monthHtml = `<table><tbody>`;
                    groups[monthKey].forEach(({ entry, json, zeitpunkt }) => {
                        const payer = json.s < 0 ? 'A' : 'D';
                        const parts = payer == 'A' ? `<span style="color:var(--nc-lk-1)">A</span>:${json.a} D:${json.d}` : `A:${json.a} <span style="color:var(--nc-lk-1)">D</span>:${json.d}`
                        monthHtml += `
                        <tr style="cursor: pointer" onClick="rowClick('${entry[0]}','${zeitpunkt}','${json.k}','${json.b}','${json.a}','${json.d}','${payer}')">
                            <td>${zeitpunkt} <span style="font-size:small">${json.k} ${parts}</span><div style="font-size:small">${json.b}</div></td>
                            <td style="text-align:right;font-weight:bold;min-width:4rem;padding: 0.6rem 0.3rem 0.6rem 0;">${add(json.a, json.d)}</td>
                            <td style="width:0"><button style="margin-top:0.2rem" onClick="deleteClick('${entry[0]}', event)">X</button></td>
                        </tr>`;
                    });
                    monthHtml += `</tbody></table>`;

                    if (index < 2) { // separiere die ersten 2 Monate (immer sichtbar) vom Rest (eingeklappt)
                        currentEntries += monthHtml;
                    } else {
                        olderEntries += monthHtml;
                        olderCount += groups[monthKey].length;
                    }
                });
                if (olderCount > 0) { // Den "Ältere Einträge" falls vorhanden nach den currentEntries einfügen
                    currentEntries += `<details style="padding:0px; margin-top: 1.5rem; margin-bottom: 1rem;">
                                        <summary style="cursor: pointer; font-weight: bold;">Ältere Einträge (${olderCount})</summary>
                                        ${olderEntries}
                                      </details>`;
                }
                document.getElementById('table-wrapper').innerHTML = currentEntries;
            }
            if (tabName == 'zahlungTab') {
                updatePersonAmounts(); // nach Wechsel auf Zahlungstab muss neu ermittelt werden welche Spalten klickbar sind etc
            }
        }
        function dateNow() { // Setup DateTime with Now https://stackoverflow.com/questions/24468518/html5-input-datetime-local-default-value-of-today-and-current-time/60884408#60884408
            var now = new Date();
            var nowUpToMin = new Date(now - now.getTimezoneOffset() * 60000);
            nowUpToMin.setSeconds(0, 0);
            return nowUpToMin.toISOString().slice(0, -1); // schneide Z am Ende weg
        }
        function add(a, d) {
            return (parseFloat(a) + parseFloat(d)).toFixed(2);
        }

        function rowClick(editId, zeitpunkt, k, b, a, d, p) {
            setEditId(editId);
            andreasShareInput.value = a;
            dagmarShareInput.value = d;
            document.getElementById('zeitpunkt').value = zeitpunkt;
            document.getElementById('amount').value = add(a, d);
            document.getElementById('beschreibung').value = b;
            document.getElementById('kategorie').value = k;
            document.getElementById('zahlungRadio').checked = true;
            if (p != null) document.getElementById(p == 'A' ? 'andreasRadio' : 'dagmarRadio').checked = true; // wenn Payer übergeben wurde update den Radio-Button
            openTab('zahlungTab');
        }
        function deleteClick(rowLocalStorageKey, event) {
            if (window.confirm("Wirklich löschen?")) {
                const thisTr = event.target.parentElement.parentElement;
                thisTr.parentElement.removeChild(thisTr);
                localStorage.removeItem(rowLocalStorageKey);
            }
            event.stopPropagation(); // das line click event soll nicht triggern
            updateSchulden();
            exportLocalStorage();
        }
        // Automatically set default split to 50/50 when amount changes
        function setDefaultSplit() {
            const amount = parseFloat(totalAmountInput.value) || 0; // guard gegen NaN
            const half = amount / 2;
            andreasShareInput.value = half.toFixed(3);
            dagmarShareInput.value = half.toFixed(3);
            updatePersonAmounts();
        }

        function updateOtherShare(thisInput, otherInput) {
            otherInput.value = (totalAmountInput.value - thisInput.value).toFixed(2);
            updatePersonAmounts();
        }
        function neuClick() {
            rowClick(null, dateNow(), 'Essen', '', '', '', null);
        }
        function speichernClick() { // die Keys enthalten den Zeitpkt damit die Sortierung danach passiert
            const editId = editIdDiv.innerText !== "" ? editIdDiv.innerText : "Ausgabe#" + document.getElementById('zeitpunkt').value.replace("T", " ") + "#" + Date.now();
            const aFloat = parseFloat(andreasShareInput.value) || 0; //  || 0 ist NaN guard
            const dFloat = parseFloat(dagmarShareInput.value) || 0;
            localStorage.setItem(editId, JSON.stringify({ // nachdem die Zeit nur min-genau ist steht am Ende ein epochMs Suffix
                a: aFloat,
                d: dFloat,
                b: document.getElementById('beschreibung').value,
                k: document.getElementById('kategorie').value,
                s: document.getElementById('andreasRadio').checked ? -dFloat : +aFloat, // wenn A wird der D Betrag mit - eingetragen (- sind Schulden von D bei A). wenn D wird der A Betrag mit + eingetragen (+ sind Schulden von A bei D)
            }));
            setEditId(editId);
            document.getElementById('infoText').textContent = "Ausgabe wurde gespeichert und kann bis auf den Zeitpunkt editiert werden";
            document.getElementById('infoText').className = "";
            document.getElementById('infoText').offsetHeight; // trigger reflow https://stackoverflow.com/a/45036752
            document.getElementById('infoText').className = "fadeout";
            updateSchulden();
            exportLocalStorage();
        }
        function exportLocalStorage() {
            const downloadContent = readLocalStorage().map(e => e[0] + "=" + e[1]).join("\n"); // relevanter localstorage content als key=value file
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([downloadContent], { type: "text/plain" }));
            const now = new Date();
            link.download = `ausgaben_export_${new Date().toLocaleString('sv-SE').replace(' ', '_').replace(/:/g, '-')}.bak.txt`; // erzeuge Filesystem kompatibles Datum. sv-SE weil dort YYYY-MM-DD und nicht DD.MM.YYYY das Format ist
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
        function deleteLocalStorage() {
            readLocalStorage().forEach(entry => localStorage.removeItem(entry[0]));
            updateSchulden();
            openTab('historyTab');
        }
        function updateSchulden() {
            const sum = readLocalStorage().map(entry => {
                const json = JSON.parse(entry[1]);
                return json.s;
            }).reduce((a, b) => a + b, 0);
            document.getElementById('schulden').textContent = sum > 0 ? "Andreas schuldet Dagmar " + sum.toFixed(2) + "€" : "Dagmar schuldet Andreas " + (-sum).toFixed(2) + "€";
        }
        function setEditId(editId) {
            editIdDiv.textContent = editId || ''; // wenn null dann wird leerstring gesetzt
            document.getElementById('zeitpunkt').readOnly = (editId ? true : false);
        }
        function updatePersonAmounts() {
            totalAmountInput.setAttribute("placeholder", "Betrag bezahlt von " + (document.getElementById('andreasRadio').checked ? 'Andreas' : 'Dagmar'));
            const geldtransfer = document.getElementById('kategorie').value == "Geldtransfer";
            const amount = parseFloat(totalAmountInput.value) || 0;
            let andreasAmount = parseFloat(andreasShareInput.value) || 0;
            let dagmarAmount = parseFloat(dagmarShareInput.value) || 0;

            if (geldtransfer || isNaN(amount) || amount <= 0) { // Geldtransfer erlaubt keinen custom split sondern ist immer 100% bei der Gegenseite
                andreasShareInput.disabled = true;
                dagmarShareInput.disabled = true;
                if (geldtransfer) {
                    const amount = parseFloat(totalAmountInput.value);
                    andreasShareInput.value = document.querySelector('input[name = payer]:checked').id == "andreasRadio" ? "0" : amount;
                    dagmarShareInput.value = andreasShareInput.value == "0" ? amount : "0";
                }
                return;
            }
            andreasShareInput.disabled = false;
            dagmarShareInput.disabled = false;
        }
        // Support for swiping left/right
        var start = null;
        window.addEventListener("touchstart", function (event) {
            if (event.touches.length === 1) { //just one finger touched
                start = event.touches.item(0).clientX;
            } else { //a second finger hit the screen, abort the touch
                start = null;
            }
        });
        window.addEventListener("touchend", function (event) {
            var offset = 50; //at least 50px are a swipe
            if (start) { //the only finger that hit the screen left it
                var end = event.changedTouches.item(0).clientX;
                if (end > start + offset) { //a left -> right swipe
                    openTab('historyTab');
                    document.getElementById('zahlungRadio').click();
                }
                if (end < start - offset) { //a right -> left swipe
                    document.getElementById('historyRadio').click();
                }
            }
        });
        // Serviceworker für PWA registrieren
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./serviceworker.js')
                    .then((reg) => console.log('Service Worker erfolgreich registriert!', reg.scope))
                    .catch((err) => console.error('Service Worker Registrierung fehlgeschlagen:', err));
            });
        }
    </script>
</body>

</html>
